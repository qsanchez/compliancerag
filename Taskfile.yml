version: "3"

vars:
  PYTHON: uv run python
  UVICORN: uv run uvicorn

tasks:
  ingest:
    desc: "Run the full document ingestion pipeline (default: GDPR only, local Chroma)"
    cmds:
      - "{{.PYTHON}} -m ingestion.pipeline"
    env:
      VECTOR_STORE: "{{.VECTOR_STORE | default \"chroma\"}}"

  eval:
    desc: "Run RAGAS evaluation against the golden dataset"
    cmds:
      - "{{.PYTHON}} -m evaluation.evaluator"
    env:
      LANGCHAIN_TRACING_V2: "false"

  test:
    desc: "Run the full test suite"
    cmds:
      - uv run pytest tests/ -v --cov=. --cov-report=term-missing
    env:
      LANGCHAIN_TRACING_V2: "false"

  test:unit:
    desc: "Run unit tests only"
    cmds:
      - uv run pytest tests/unit/ -v
    env:
      LANGCHAIN_TRACING_V2: "false"

  test:integration:
    desc: "Run integration tests only"
    cmds:
      - uv run pytest tests/integration/ -v
    env:
      LANGCHAIN_TRACING_V2: "false"

  test:regression:
    desc: "Run regression tests only"
    cmds:
      - uv run pytest tests/regression/ -v
    env:
      LANGCHAIN_TRACING_V2: "false"

  dev:
    desc: "Start the FastAPI development server with hot reload"
    cmds:
      - "{{.UVICORN}} api.main:app --host 0.0.0.0 --port 8000 --reload"

  infra:up:
    desc: "Start local infrastructure (Postgres + pgvector + Chroma)"
    cmds:
      - docker compose up -d
      - docker compose ps

  infra:down:
    desc: "Stop local infrastructure"
    cmds:
      - docker compose down

  analytics:load:
    desc: "Convert GDPR fines CSV → Parquet and upload to S3 (requires ATHENA_S3_DATA_BUCKET)"
    cmds:
      - "{{.PYTHON}} -m analytics.loaders.gdpr_fines"

  deploy:build:
    desc: "Build Lambda container image (tag: compliancerag-dev or compliancerag-{ENV})"
    cmds:
      - docker build -t compliancerag-{{.ENV | default "dev"}}:latest .

  deploy:push:
    desc: "Authenticate to ECR and push image (requires ECR_REPO env var from: terraform output ecr_repository_url)"
    cmds:
      - aws ecr get-login-password --region {{.AWS_REGION | default "eu-west-1"}} | docker login --username AWS --password-stdin $ECR_REPO
      - docker tag compliancerag-{{.ENV | default "dev"}}:latest $ECR_REPO:latest
      - docker push $ECR_REPO:latest

  deploy:update-lambda:
    desc: "Update Lambda to use the latest ECR image (requires ECR_REPO and FUNCTION_NAME env vars)"
    cmds:
      - aws lambda update-function-code --function-name $FUNCTION_NAME --image-uri $ECR_REPO:latest

  lint:
    desc: "Run ruff linter"
    cmds:
      - uv run ruff check .

  format:
    desc: "Run ruff formatter"
    cmds:
      - uv run ruff format .

  typecheck:
    desc: "Run mypy type checker"
    cmds:
      - uv run mypy .
