version: "3"

vars:
  PYTHON: uv run python
  UVICORN: uv run uvicorn

tasks:
  ingest:
    desc: "Run the full document ingestion pipeline (default: GDPR only)"
    cmds:
      - "{{.PYTHON}} -m ingestion.pipeline"

  eval:
    desc: "Run RAGAS evaluation against the golden dataset"
    cmds:
      - "{{.PYTHON}} -m evaluation.evaluator"
    env:
      LANGCHAIN_TRACING_V2: "false"

  test:
    desc: "Run the full test suite"
    cmds:
      - uv run pytest tests/ -v --cov=. --cov-report=term-missing
    env:
      LANGCHAIN_TRACING_V2: "false"

  test:unit:
    desc: "Run unit tests only"
    cmds:
      - uv run pytest tests/unit/ -v
    env:
      LANGCHAIN_TRACING_V2: "false"

  test:integration:
    desc: "Run integration tests only"
    cmds:
      - uv run pytest tests/integration/ -v
    env:
      LANGCHAIN_TRACING_V2: "false"

  lint:
    desc: "Run ruff linter"
    cmds:
      - uv run ruff check .

  format:
    desc: "Run ruff formatter"
    cmds:
      - uv run ruff format .

  typecheck:
    desc: "Run mypy type checker"
    cmds:
      - uv run mypy .

  api:up:
    desc: "Start the local API server with hot reload"
    cmds:
      - "{{.UVICORN}} api.main:app --host 0.0.0.0 --port 8000 --reload"

  api:down:
    desc: "Stop the local API server"
    cmds:
      - pkill -f "uvicorn api.main:app" || true

  local_infra:up:
    desc: "Start local infrastructure (Postgres + pgvector)"
    cmds:
      - docker compose up -d
      - docker compose ps

  local_infra:down:
    desc: "Stop local infrastructure"
    cmds:
      - docker compose down

  cloud_infra:init:
    desc: "Initialise Terraform (download providers, set up backend)"
    cmds:
      - terraform -chdir=infra init

  cloud_infra:plan:
    desc: "Preview AWS infrastructure changes (ENV=local|prod, default: local)"
    cmds:
      - terraform -chdir=infra plan -var-file=environments/{{.ENV | default "local"}}.tfvars

  cloud_infra:apply:
    desc: "Provision / update AWS infrastructure (ENV=local|prod, default: local)"
    cmds:
      - terraform -chdir=infra apply -var-file=environments/{{.ENV | default "local"}}.tfvars

  cloud_infra:destroy:
    desc: "Tear down AWS infrastructure (ENV=local|prod, default: local)"
    cmds:
      - terraform -chdir=infra destroy -var-file=environments/{{.ENV | default "local"}}.tfvars

  app:build:
    desc: "Build Lambda container image (tag: compliancerag-{ENV}, default: dev)"
    cmds:
      - docker build --platform linux/arm64 --provenance=false -t compliancerag-{{.ENV | default "dev"}}:latest .

  app:push:
    desc: "Authenticate to ECR and push image (requires ECR_REPO from: terraform output ecr_repository_url)"
    cmds:
      - aws ecr get-login-password --region {{.AWS_REGION | default "eu-west-1"}} | docker login --username AWS --password-stdin $ECR_REPO
      - docker tag compliancerag-{{.ENV | default "dev"}}:latest $ECR_REPO:latest
      - docker push --platform linux/arm64 $ECR_REPO:latest

  app:deploy:
    desc: "Update Lambda to use the latest ECR image (requires ECR_REPO and FUNCTION_NAME)"
    cmds:
      - aws lambda update-function-code --function-name $FUNCTION_NAME --image-uri $ECR_REPO:latest

  analytics:extract:
    desc: "Download real GDPR fines CSV from enforcementtracker.com → datasets/gdpr_fines_raw.csv"
    cmds:
      - "{{.PYTHON}} -m analytics_etl.extract.gdpr_fines"

  analytics:load:
    desc: "Convert GDPR fines CSV → Parquet and upload to S3 (requires ATHENA_S3_DATA_BUCKET; run analytics:extract first for real data)"
    cmds:
      - "{{.PYTHON}} -m analytics_etl.loaders.gdpr_fines"

  frontend:config:
    desc: "Generate frontend/config.js from Terraform outputs (run after cloud_infra:apply, ENV=prod|local)"
    cmds:
      - |
        API_URL=$(terraform -chdir=infra output -raw api_endpoint)
        COGNITO_CLIENT_ID=$(terraform -chdir=infra output -raw cognito_client_id)
        COGNITO_LOGIN_URL=$(terraform -chdir=infra output -raw cognito_login_url)
        REDIRECT_URI=$(terraform -chdir=infra output -raw frontend_url)
        sed -e "s|__API_URL__|$API_URL|g" \
            -e "s|__COGNITO_CLIENT_ID__|$COGNITO_CLIENT_ID|g" \
            -e "s|__COGNITO_LOGIN_URL__|$COGNITO_LOGIN_URL|g" \
            -e "s|__REDIRECT_URI__|$REDIRECT_URI|g" \
            frontend/config.template.js > frontend/config.js
        echo "Generated frontend/config.js"

  frontend:deploy:
    desc: "Build config.js, sync frontend assets to S3, and invalidate CloudFront cache (ENV=prod|local)"
    cmds:
      - task: frontend:config
      - aws s3 sync frontend/ s3://$(terraform -chdir=infra output -raw frontend_bucket_name)/ --delete --exclude "config.template.js"
      - aws cloudfront create-invalidation --distribution-id $(terraform -chdir=infra output -raw cloudfront_distribution_id) --paths "/*"
