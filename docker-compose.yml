services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliancerag-postgres
    environment:
      POSTGRES_USER: compliancerag
      POSTGRES_PASSWORD: compliancerag
      POSTGRES_DB: compliancerag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliancerag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
