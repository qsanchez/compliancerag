[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliancerag"
version = "0.1.0"
description = "Hybrid RAG + Analytical Agent for Regulatory Compliance (GDPR, NIS2, DORA)"
requires-python = ">=3.11"
dependencies = [
    # LLM & embeddings
    "litellm>=1.40.0",
    "boto3>=1.34.0",
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langsmith>=0.1.90",
    # Vector stores
    "chromadb>=0.5.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.1.0",
    # Document processing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    # Chunking & embeddings helpers
    "tiktoken>=0.7.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Analytics
    "pyathena>=3.7.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    # Evaluation
    "ragas>=0.1.14",
    "datasets>=2.19.0",
    # Observability
    "structlog>=24.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
    "pillow>=12.2.0",
    "sentence-transformers>=3.0.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "analytics", "api", "evaluation", "ingestion", "observability", "rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
